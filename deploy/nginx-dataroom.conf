# Included inside the HTTPS server block for kineticaminera.com.
# Forwards https://kineticaminera.com/dataroom and everything below it to the
# Next.js app, which is built with BASE_PATH=/dataroom and handles the prefix
# (and its own trailing-slash redirects) itself.

location ~ ^/dataroom(/|$) {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    client_max_body_size 110m;
}
